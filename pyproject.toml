[project]
name = "ragbench-fr"
version = "0.1.0"
description = "Reproducible French benchmark of RAG architectures (closed-book, naive, Adaptive, CRAG, Self-RAG)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Aziz Ben Ayed" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
]

[project.scripts]
ragbench = "ragbench.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.uv]
required-version = ">=0.13.0"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# The specification contains illustrative pseudo-code that must stay as written.
exclude = ["docs/specification.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PTH", "T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: tests that need real services or network (excluded by default)",
]

[tool.coverage.run]
source = ["ragbench"]
branch = true
omit = ["src/ragbench/llm/providers/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
