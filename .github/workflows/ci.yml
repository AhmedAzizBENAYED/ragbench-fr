name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL with pgvector for the db tests; same pinned image as docker-compose.yml (a unit
    # test keeps them identical). Throwaway credentials of an ephemeral service, not a secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: ragbench
          POSTGRES_PASSWORD: ragbench
          POSTGRES_DB: ragbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbench -d ragbench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # db tests must run in CI: an unreachable database fails them instead of skipping.
      RAGBENCH_REQUIRE_DB: "1"
      RAGBENCH_TEST_PG_DSN: postgresql://ragbench:ragbench@localhost:5432/ragbench
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv no longer publishes floating major tags (last one: v7), hence the full version.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      # mypy follows imports into torch and transformers: a cold run is several times slower.
      # Exact key = same lockfile and sources; restore-keys reuse the latest cache for the same
      # lockfile (mypy then only rechecks what changed).
      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-

      - name: Type-check
        run: make typecheck

      - name: Test with coverage
        run: make test
