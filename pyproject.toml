[project]
name = "ragbench-fr"
version = "0.1.0"
description = "Reproducible French benchmark of RAG architectures (closed-book, naive, Adaptive, CRAG, Self-RAG)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Aziz Ben Ayed" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.7.0",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "typer",
]

[project.scripts]
ragbench = "ragbench.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.uv]
required-version = ">=0.13.0"

# torch comes from the CPU-only PyTorch index on every platform: PyPI's Linux wheels pull several
# GB of CUDA libraries (nvidia-*), useless for CPU embeddings in CI and on laptops.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# The specification contains illustrative pseudo-code that must stay as written.
exclude = ["docs/specification.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PTH", "T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "integration: tests that need real services or network (excluded by default)",
    "db: tests that need PostgreSQL with pgvector (skipped if unreachable, unless RAGBENCH_REQUIRE_DB=1)",
]

[tool.coverage.run]
source = ["ragbench"]
branch = true
# Thin adapters to heavy third-party runtimes (NFR-6): exercised by integration tests only.
omit = [
    "src/ragbench/llm/providers/*",
    "src/ragbench/index/_st_backend.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
